# Cryptic: writes more clues once a week (and on request), keeps only the ones the checker
# accepts, and commits them. GitHub Pages then republishes by itself.
# Needs an OPENCODE_API_KEY repository secret; without it the job does nothing.
name: Write more cryptic clues

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      count:
        description: "How many clues to add"
        default: "12"

permissions:
  contents: write

concurrency:
  group: cryptic-clues
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write and check clues
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          COUNT: ${{ inputs.count || '12' }}
        run: |
          [ -n "$OPENCODE_API_KEY" ] || { echo "::notice::No OPENCODE_API_KEY secret, so no clues were written."; exit 0; }
          case "$COUNT" in ''|*[!0-9]*) COUNT=12 ;; esac
          node tools/cryptic-generate.mjs "$COUNT"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cryptic/data/generated.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "More cryptic clues"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep $((i * 4)); done
          exit 1
