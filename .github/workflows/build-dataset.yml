# Builds the ready-made puzzle dataset (data/variant-bank.json) on GitHub's machines,
# so no generation has to happen on a laptop or phone. Each run re-verifies what's
# there, fills gaps for up to ~5.5 hours, commits the result and redeploys Pages.
# The dataset covers every single variant, all 151 pairs and 48 three-way mixes; once it's
# full, a daily run only re-verifies and tops up (a few minutes).
name: Build puzzle dataset

on:
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  schedule:
    - cron: "0 7 * * *"         # daily 07:00 UTC: fills gaps until full, then just tops up
  push:
    branches: [main]
    paths: ["js/core/**", "tools/**", ".github/workflows/build-dataset.yml"]

permissions:
  contents: write               # commit the dataset
  pages: write                  # ask Pages to redeploy

concurrency:
  group: build-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-verify existing puzzles
        run: node tools/verify-variant-bank.mjs
      - name: Build missing puzzles (time-limited)
        run: node tools/build-variant-bank.mjs --workers 4 --total-minutes 320 --minutes-per-key 3
      - name: Verify again
        run: node tools/verify-variant-bank.mjs
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/variant-bank.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update puzzle dataset"
          # The app may have been redeployed while this ran: replay on top, then push.
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Redeploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will redeploy on its own"
